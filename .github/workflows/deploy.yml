name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The Astro build's prebuild hook runs scripts/build-islands.py via uv to
      # generate the marimo island fragments and WASM notebook exports. uv must
      # be on PATH before withastro/action runs `pnpm run build`; uv auto-fetches
      # the Python version the script declares.
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 24
          package-manager: pnpm@10.33.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
